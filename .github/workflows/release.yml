name: Build Xiaoleng Comic release
run-name: 构建小冷漫画 ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      macSign:
        description: 使用已配置的 Developer ID 为 Apple 芯片包签名并公证
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: xiaoleng-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验版本标签
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: 检查源码与标签的版本是否一致
        run: |
          bun -e 'import { appVersion } from "./appConfig.ts"; if (!/^refs\/tags\/v\d+\.\d+\.\d+$/.test(process.env.GITHUB_REF || "") || process.env.GITHUB_REF_NAME !== `v${appVersion}`) throw new Error("请使用与 appConfig.ts 一致的版本标签运行构建");'

  build:
    name: 打包桌面版
    needs: prepare
    uses: ./.github/workflows/debug.yml
    with:
      target: desktop
      version: ${{ github.ref_name }}
      macSign: ${{ inputs.macSign }}
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARIZATION_KEY_ID: ${{ secrets.MACOS_NOTARIZATION_KEY_ID }}
      MACOS_NOTARIZATION_ISSUER_ID: ${{ secrets.MACOS_NOTARIZATION_ISSUER_ID }}
      MACOS_NOTARIZATION_KEY_BASE64: ${{ secrets.MACOS_NOTARIZATION_KEY_BASE64 }}
